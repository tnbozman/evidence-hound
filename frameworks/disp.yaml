# DISP membership readiness: what Defence looks at when a business applies for or keeps membership of the Defence Industry
# Security Program, as a CISO Assistant library. s14-02.
# Written from the public control areas of the Defence Security Principles Framework (DSPF): governance, personnel, physical,
# information and cyber security. Every description is a paraphrase in Evidence Hound's own words, and each requirement's annotation
# cites its DSPF area. It is a readiness checklist, not the DSPF: read the DSPF and Defence's DISP guidance for the authoritative text
# and the level of membership you apply for, and check your obligations with your DISP contact.
# Group M (membership) holds every requirement. The cyber area has one requirement per Essential Eight strategy, so the Essential Eight
# evidence answers it (mappings/disp.yaml).
# Snapshot: hound framework snapshot frameworks/disp.yaml --out frameworks/disp.json
# Changes (raise `version` with each content change):
#   version 1 (2026-11-25): first version.

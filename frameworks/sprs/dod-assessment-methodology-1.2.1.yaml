# The NIST SP 800-171 DoD Assessment Methodology, Version 1.2.1, June 24, 2020, Annex A: the points each NIST SP 800-171 Rev 2
# requirement takes off the score of 110 when it is not implemented. Values copied from the published table (pages 12 to 20);
# the lowest possible score is -203. `hound sprs score` reads this file (s17-05). DoD's methodology is authoritative: check this
# file against it, and replace it when DoD publishes a new version.
#
# - partial: the methodology's two partial deductions, 3.5.3 (MFA) and 3.13.11 (FIPS-validated cryptography). hound always takes the
#   full points off and names the partial case, because only a person can say which case applies.
# - not_applicable_when: the methodology says not to subtract points when the capability is not permitted. Record the requirement
#   as not applicable in CISO Assistant, with the policy that keeps the capability disabled.
# - 3.12.4 (system security plan) has no points: without a plan the assessment cannot be completed.

# yaml-language-server: $schema=../schemas/mapping.schema.json
# ASD Essentials for enterprise IT, priority phase 1 (the boundary and identity services domains, and the governance and visibility
# domains every phase assesses), for the checks Evidence Hound has today. s14-01.
#
# - Drafted with `hound mapping derive` from mappings/essential-eight-2023.yaml and ASD's transition mapping
#   (frameworks/mapping-essential-eight-2023-and-asd-essentials-enterprise-it.yaml): each action row has the union of the checks of
#   the Essential Eight controls ASD links to it, rule all_pass. Every ASD link is `intersect`, so a row is only as wide as its
#   checks: read each row's comment and check it fits your environment before you rely on it.
# - Checked row by row with AI help (Claude) on 2026-11-25 and the draft marks removed; not yet reviewed by an assessor, so review it
#   in your own copy before you rely on it. Additions to the derived draft say why in the row's
#   comment: the six Essential Eight controls ASD does not link (in the homes docs/migrations/essential-eight-to-asd-essentials.md
#   suggests), legacy authentication from Microsoft 365, supplier assurance from the ciso-assistant profile, and the new ground
#   from the manual sources in examples/manual-sources/essentials/.
# - Rows name one action in one domain by URN (an action is rated in every domain it applies to). Phase 2 and 3 rows are not mapped
#   yet: derive them with `hound mapping derive ... --groups 2` when your programme reaches that phase.
# - The Essential Eight 2023 audit stays the audit of record until the cut-over; run both audits from one config (targets[]).
framework_urn: urn:intuitem:risk:framework:asd-essentials-enterprise-it

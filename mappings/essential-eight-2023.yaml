# yaml-language-server: $schema=../schemas/mapping.schema.json
# Essential Eight Maturity Model (November 2023), maturity levels 1 and 2, for the checks Evidence Hound has today.
# The audit selects implementation groups 1 and 2; ML3-only rows are skipped when publishing, not reported as errors.
#
# - ISM controls the framework lists under several mitigation strategies use `rows: all`: the control has the same text
#   under each strategy, so one result is written to every strategy's row.
# - Results from collector checks are only as wide as what the collector sees: the Microsoft 365 checks cover Microsoft 365
#   and Intune-managed Windows devices, and the Sophos checks the firewalls Sophos Central manages, not other systems in scope.
#   Each requirement's comment says what stands behind it.
# - Every other ML1 and ML2 requirement is mapped to a manual source from examples/manual-sources/essential-eight/: a person
#   attests it with `hound manual approve` and the next run publishes it (s10-04). `manual_only` would list a requirement no
#   manual source covers; none is left. See docs/mapping-files.md.
framework_urn: urn:intuitem:risk:framework:essential-eight-2023
description: Essential Eight (November 2023) ML1 and ML2, from the Microsoft 365 and Sophos Central (network devices) collectors and manual sources.
requirements:
  # Multi-factor authentication. MFA required for every user of Microsoft 365, every member registered for MFA, and legacy authentication (which bypasses MFA) blocked.
  - ref: ISM-1504
    rule: all_pass
    checks:
      - identity.mfa.enforced_conditional_access
      - identity.mfa.registered_all_users
      - identity.legacy_auth_blocked
  # Multi-factor authentication. Privileged users of Microsoft 365 must use MFA; the admin check also requires phishing-resistant MFA for every privileged role.
  # Sophos Central admins are not checked: Sophos Central requires MFA of every admin itself and its API does not show it, so
  # keep that as manual evidence (docs/collectors/sophos.md).
  - ref: ISM-1173
    rule: all_pass
    checks:
      - identity.mfa.enforced_conditional_access
      - identity.mfa.phishing_resistant_admins
  # Restrict administrative privileges. Cloud-only privileged accounts are separate from users' synchronised everyday accounts. Covers Microsoft 365 roles only.
  - ref: ISM-0445
    rule: all_pass
    checks:
      - identity.privileged.admins_cloud_only
  # Restrict administrative privileges. Privileged roles in Microsoft 365 held by few accounts, and only activated when needed,
  # and few Sophos Central admins hold Super Admin (Sophos Central is the online service that manages the network devices).
  - ref: ISM-1883
    rule: all_pass
    checks:
      - identity.privileged.global_admin_count
      - identity.privileged.pim_eligible_not_permanent
      - network.management.super_admin_count
  # Patch operating systems. Every Intune-managed Windows device runs a supported build, and every firewall managed in Sophos
  # Central runs supported firmware (the operating system of an internet-facing network device). Devices outside Intune and
  # Sophos Central are not seen. Without one of the collectors, drop its check here in your own copy (docs/collectors/sophos.md).
  - ref: ISM-1501
    rule: all_pass
    checks:
      - endpoint.os.supported_versions
      - network.firewall.firmware_supported
      - vuln.operating_systems.unsupported_removed
  # Patch operating systems. Internet-facing network devices: no firmware upgrade offered to a Sophos Central firewall for more
  # than firmware_update_days (14); internet-facing services: no scanned finding past its window (two weeks, or 48 hours when an
  # exploit exists). Both must pass.
  - ref: ISM-1694
    rule: all_pass
    checks:
      - network.firewall.firmware_current
      - vuln.internet_facing.patched_in_window
  # Patch operating systems. Intune compliance stands for ISM-1695 only if its policy requires a minimum OS version that tracks monthly
  # updates; the operating system scans show what is still missing a month after release.
  - ref: ISM-1695
    rule: all_pass
    checks:
      - endpoint.managed.compliant_ratio
      - vuln.operating_systems.patched_in_window
  # Restrict Microsoft Office macros.
  - ref: ISM-1488
    rule: all_pass
    checks:
      - apps.office.macros_blocked_from_internet
  # Restrict Microsoft Office macros. The ASR rule blocking Win32 API calls from Office macros.
  - ref: ISM-1673
    rule: all_pass
    checks:
      - endpoint.asr.office_rules_enabled
  # User application hardening. The ASR rule blocking Office from creating child processes.
  - ref: ISM-1667
    rule: all_pass
    checks:
      - endpoint.asr.office_rules_enabled
  # User application hardening. The ASR rule blocking Office from creating executable content.
  - ref: ISM-1668
    rule: all_pass
    checks:
      - endpoint.asr.office_rules_enabled
  # User application hardening. The ASR rule blocking Office from injecting code into other processes.
  - ref: ISM-1669
    rule: all_pass
    checks:
      - endpoint.asr.office_rules_enabled
  # Multi-factor authentication, Restrict administrative privileges, Application control, User application hardening. Manual source: the incident register.
  - ref: ISM-0123

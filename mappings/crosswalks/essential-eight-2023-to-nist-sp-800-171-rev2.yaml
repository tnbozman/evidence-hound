# Essential Eight (November 2023) ML1 and ML2 to NIST SP 800-171 Rev 2: which 800-171 requirements Essential Eight evidence answers.
# s12-08. ADVISORY: drafted with AI (Claude) from the requirement texts on 2026-11-24 and not yet reviewed by an assessor. Review it
# before you rely on it, and record the review below. Titles are summaries in our own words; NIST SP 800-171 Rev 2 has the full text.
#
# relationship (CISO Assistant's mapping vocabulary): equal (same ask), superset (the Essential Eight requirement asks for more),
# subset (it asks for less), intersect (they overlap). `hound mapping crosswalk` counts a requirement as answered only through equal or
# superset links with checks behind them; subset and intersect links make it partly answered. Most links here are partial on purpose:
# the Essential Eight is narrower in scope (for example workstations or online services only) than 800-171 (every system holding CUI).
from: urn:intuitem:risk:framework:essential-eight-2023
to: urn:intuitem:risk:framework:nist-sp-800-171-rev2
# reviewed: {by: <name or role>, on: YYYY-MM-DD}   # add once a person has checked every link

description: The roles endpoint fails, so only the checks over user roles are unable to assess.
now: 2026-11-22T02:00:00Z
settings:
  client_id: 00000000-0000-4000-8000-0000000000c1
  supported_os: "15"
secrets:
  client_secret: example-test-client-secret
responses:
  - { post: /oauth2/token, file: recordings/token.json }
  - { get: /v1/whoami, file: recordings/whoami.json }
  - { get: /v1/orgs/org-0001/devices, file: recordings/devices.json }
  - { get: /v1/orgs/org-0001/devices, query: { cursor: page-2 }, file: recordings/devices.2.json }
  - { get: /v1/orgs/org-0001/users, query: { offset: "0" }, file: recordings/users.json }
  - { get: /v1/orgs/org-0001/users, query: { offset: "2" }, file: recordings/users.2.json }
  - { get: /v1/orgs/org-0001/roles, status: 500, body: '{ "error": "recorded failure" }' }
expect:
  example.device.os_supported: fail          # 14.6 is not in "15"
  example.device.recently_seen: pass
  example.identity.mfa_users: unable_to_assess
  example.identity.owner_count: unable_to_assess

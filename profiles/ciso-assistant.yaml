# CISO Assistant itself, read with a read-only API token (s11-13): what only CISO Assistant holds about the AI register and
# suppliers. The AI register entries (screening, use, oversight, dates) live in the compliance repo and are checked by the built-in
# ai-register collector; `hound scope apply` copies them to CISO Assistant as filtering labels, which this profile reads to find
# the AI systems. It checks that elevated AI systems are linked to a risk scenario, and that suppliers' solutions have
# a current assessment and an active contract. It also checks that risk studies are reviewed within an interval, that no approved
# exception is past its expiry date, and that every critical system (one with a recovery time objective) has its recovery tested
# in the business impact analysis. See docs/collectors/ciso-assistant.md.
# Token: a CISO Assistant API token for a user whose role can only read (for example the built-in Reader role) on the domains checked.
profile: ciso-assistant
version: "1.2.0"
source: evidence-hound/profiles/ciso-assistant.yaml
description: CISO Assistant's AI systems, supplier assessments and contracts, risk studies, exceptions and business impact analysis, read with a read-only token.
requires:
  hound: ">=0.1"

parameters:
  base_url:
    type: url
    required: true
    description: CISO Assistant's API, ending in /api/, for example https://ciso.example.com/api/.
  risk_review_interval:
    type: duration
    default: P365D
    description: A risk study not updated for longer than this is overdue for review, as an ISO 8601 duration.

secrets:
  token:
    required: true
    description: An API token of a CISO Assistant user who can only read.

connection:
  base_url: ${base_url}
  allowed_hosts: ["${base_url}"]
  auth: { type: api_key, in: header, name: Authorization, value: "Token ${secrets.token}" }
  rate_limit:
    per_second: 5
    max_retries: 3

queries:
  assets:
    get: assets/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, name, ref_id, filtering_labels, solutions, disaster_recovery_objectives]
  risk_scenarios:
    get: risk-scenarios/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, ref_id, name, assets]
  solutions:
    get: solutions/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, ref_id, name, provider_entity, assets]
  entity_assessments:
    get: entity-assessments/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, name, entity, conclusion, expiry_date]
  contracts:
    get: contracts/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, ref_id, name, status, end_date, solutions]
  risk_assessments:
    get: risk-assessments/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, ref_id, name, status, updated_at]
  security_exceptions:
    get: security-exceptions/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, ref_id, name, status, expiration_date]
  asset_assessments:
    get: resilience/asset-assessments/
    paging: { style: offset, offset_param: offset, limit_param: limit, limit: 100, total: $.count }
    items: $.results
    keep: [id, str, asset, bia, recovery_tested]

datasets:
  # Assessments concluded ok whose conclusion has not expired (no expiry date counts as current).
  current_assessments:
    from: entity_assessments
    where:
      - { field: $.conclusion, equals: ok }
      - { field: $.expiry_date, older_than: P0D, negate: true, missing: pass }
  # Active contracts not past their end date (no end date counts as current).
  current_contracts:
    from: contracts
    where:
      - { field: $.status, equals: active }
      - { field: $.end_date, older_than: P0D, negate: true, missing: pass }
  # AI systems the screening questions put at elevated, with the risk scenarios linked to them.
  ai_risk_assets:
    from: assets
    where: { field: "$.filtering_labels[*].str", any_matches: "^ai-screening-elevated$" }
    join:
      - with: risk_scenarios
        on: { left: $.id, right: "$.assets[*].id" }
        as: risks
        optional: true
  # Every supplier's solution, with its supplier's current assessments, its current contracts and the assets it provides.
  supplier_solutions:
    from: solutions
    join:
      - with: current_assessments
        on: { left: $.provider_entity.id, right: $.entity.id }
        as: assessments
        optional: true
      - with: current_contracts
        on: { left: $.id, right: "$.solutions[*].id" }
        as: contracts
        optional: true
      - with: assets
        on: { left: "$.assets[*].id", right: $.id }
        as: provided
        optional: true
  # Each business impact analysis assessment, with the system it assesses (for its recovery objectives).
  bia_systems:
    from: asset_assessments
    join:
      - with: assets
        on: { left: $.asset.id, right: $.id }
        as: system
        optional: true
  # The solutions that provide a third-party AI system.
  ai_supplier_solutions:
    from: supplier_solutions
    where: { field: "$.provided[*].filtering_labels[*].str", any_matches: "^ai-use-third-party$" }

checks:
  - id: ai.risks_in_register
    title: Elevated AI systems have their risks in the risk register
    over: ai_risk_assets
    each: { field: "$.risks[0].id", exists: true, missing: fail }
    require: all
    when_empty: not_applicable
    describe: "AI6-3.3 Implement controls for AI system risks: {passed} of {matched} elevated AI systems are linked to a risk scenario. Record each one's risks as risk scenarios linked to its asset in CISO Assistant."

  - id: ai.suppliers_assessed
    title: Third-party AI suppliers have a current assessment
    over: ai_supplier_solutions
    each: { field: "$.assessments[0].id", exists: true, missing: fail }
    require: all
    when_empty: not_applicable
    describe: "AI6-4.3 Supply chain transparency: {passed} of {matched} solutions providing a third-party AI system come from a supplier with a current assessment concluded ok. Review the supplier, including what it tells you about its AI."

  - id: ai.supplier_contracts_current
    title: Third-party AI solutions have an active contract
    over: ai_supplier_solutions
    each: { field: "$.contracts[0].id", exists: true, missing: fail }
    require: all
    when_empty: not_applicable
    describe: "AI6-1.2 Supply chain accountabilities: {passed} of {matched} solutions providing a third-party AI system have an active contract not past its end date. Renew the contract, or record the current one in the supplier's file."

  - id: supplier.assessments_current
    title: Suppliers have a current assessment
    over: supplier_solutions
    each: { field: "$.assessments[0].id", exists: true, missing: fail }
    require: all
    when_empty: not_applicable
    describe: "{passed} of {total} suppliers' solutions come from a supplier with a current assessment concluded ok."

  - id: supplier.contracts_current
    title: Suppliers' solutions have an active contract
    over: supplier_solutions
    each: { field: "$.contracts[0].id", exists: true, missing: fail }
    require: all
    when_empty: not_applicable
    describe: "{passed} of {total} suppliers' solutions have an active contract not past its end date."

  - id: risk.studies_reviewed
    title: Risk studies are reviewed within the interval
    over: risk_assessments
    where: { field: $.status, equals: deprecated, negate: true, missing: pass }
    each: { field: $.updated_at, within: "${risk_review_interval}" }
    require: all
    when_empty: fail
    describe: "{passed} of {matched} risk studies in use were updated within ${risk_review_interval}. Review each overdue study with its owner and record the outcome in CISO Assistant."

  - id: risk.exceptions_current
    title: No approved exception is past its expiry date
    over: security_exceptions
    where: { field: $.status, equals: approved }
    each: { field: $.expiration_date, older_than: P0D, negate: true, missing: pass }
    require: all
    when_empty: not_applicable
    describe: "{passed} of {matched} approved exceptions are not past their expiry date. Renew each expired one with a new expiry date, or resolve it."

  - id: bia.recovery_tested
    title: Critical systems have their recovery tested
    over: bia_systems
    # CISO Assistant's asset list gives each recovery objective set above zero as text, such as "RTO: 4h".
    where: { field: "$.system[0].disaster_recovery_objectives[*].str", any_matches: "(?i)^rto: ", missing: fail }
    each: { field: $.recovery_tested, equals: true, missing: fail }
    require: all
    when_empty: not_applicable
    describe: "{passed} of {matched} business impact analysis assessments of critical systems (those with a recovery time objective) have recovery tested. Test each one's restore and record it in the business impact analysis."

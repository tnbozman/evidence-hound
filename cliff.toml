# git-cliff configuration: CHANGELOG.md and release notes from Conventional Commits (scripts/changelog.sh).
# Commits look like "feat(s13-03): what changed [green]". Features and fixes are listed, each with its sprint task;
# tests, docs, chores, refactors and CI changes are not. TDD markers ([red], [green]) are dropped.

[changelog]
header = """
# Changelog

Features and fixes in each release of Evidence Hound, from its Conventional Commits. The sprint files in
[docs/sprints](docs/sprints/README.md) say what each task delivered and how it was checked.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits | sort(attribute="message") -%}
- {{ commit.message | split(pat="\n") | first | trim }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor -%}
{% endfor %}
"""
trim = false
footer = ""
# Lint-clean Markdown: a blank line before each version heading, never two blank lines, addresses as code (not bare links).
postprocessors = [
  { pattern = '([^\n])\n## ', replace = "${1}\n\n## " },
  { pattern = '\n{3,}', replace = "\n\n" },
  { pattern = '([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})', replace = "`${1}`" },
  { pattern = '\n+$', replace = "\n" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\s*\[(red|green)\]', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^security", group = "<!-- 3 -->Security" },
  { message = ".*", skip = true },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/", "/templates/collector"]
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["xunit*", "FsCheck*", "Shouldly", "WireMock*", "Testcontainers*", "coverlet*", "Microsoft.NET.Test.Sdk"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
    # Stay on .NET 10 LTS: take patches and minors, not the next major (decided 2026-11-25).
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/tools/markdown"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/deploy/compose", "/src/EvidenceHound.Cli"]
    schedule:
      interval: weekly
    # Stay on .NET 10 LTS images (global.json pins the 10.0 SDK).
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directories: ["/deploy/compose", "/dev/ciso-assistant"]
    schedule:
      interval: weekly
    # A new PostgreSQL major cannot open an existing data folder: it needs a planned dump and restore.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly

name: Runner image

# Publishes the collector runner image `dev` from main to GHCR, with build provenance. Release versions (such as
# 1.0.0 and 1.0) are published by the release workflow (release.yml) from a v* tag, after approval.
# CI (ci.yml, job `image`) builds, tests and scans the same Dockerfile on every push and PR.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
      - name: Build (amd64) and load for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/EvidenceHound.Cli/Dockerfile
          load: true
          tags: evidence-hound-runner:candidate
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Test the image
        run: HOUND_IMAGE=evidence-hound-runner:candidate bats tests/image
      - name: Scan the image (high and critical findings stop the publish)
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: evidence-hound-runner:candidate
          severity-cutoff: high
          output-format: table
      - id: push
        name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/EvidenceHound.Cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

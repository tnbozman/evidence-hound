name: CI

on:
  push:
    branches: [main, "sprint/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Pin every action to a full commit SHA in s00-03; Dependabot keeps them current.

  build-test:
    # Steps are skipped until s00-01 adds global.json and the solution.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('global.json') != '' }}
        with:
          global-json-file: global.json
      - name: Restore
        if: ${{ hashFiles('global.json') != '' }}
        run: dotnet restore --locked-mode
      - name: Format check
        if: ${{ hashFiles('global.json') != '' }}
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        if: ${{ hashFiles('global.json') != '' }}
        run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true
      - name: Unit and contract tests
        if: ${{ hashFiles('global.json') != '' }}
        run: >
          dotnet test --no-build -c Release
          --filter "Category!=Functional"
          --logger trx --results-directory test-results
          --collect:"XPlat Code Coverage"
      - name: Upload test results
        if: ${{ always() && hashFiles('global.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  functional:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('global.json') != '' }}
        with:
          global-json-file: global.json
      - name: Functional tests (Testcontainers starts CISO Assistant)
        if: ${{ hashFiles('global.json') != '' }}
        run: dotnet test -c Release --filter "Category=Functional" --logger trx --results-directory test-results
      - name: Upload functional results
        if: ${{ always() && hashFiles('global.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-results
          path: test-results

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh
      - name: Script tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats
          bats scripts/tests

  org-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for organisation-specific terms
        # Secrets are not available to PRs from forks; those are checked again on merge to main.
        if: github.event.pull_request.head.repo.fork != true
        env:
          ORG_DENYLIST: ${{ secrets.ORG_DENYLIST }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'origin/main..HEAD' }}
        run: scripts/check-org-data.sh "$RANGE"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

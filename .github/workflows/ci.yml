name: CI

on:
  push:
    branches: [main, "sprint/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

# Every action is pinned to a full commit SHA (comment shows the tag). Dependabot keeps them current.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: make restore
      - name: Lint (format and code style)
        run: make lint-dotnet
      - name: Build
        run: make build CONFIGURATION="$CONFIGURATION"
      - name: Unit and contract tests with coverage
        run: make coverage CONFIGURATION="$CONFIGURATION"
      - name: Library profile tests
        run: make test-profiles CONFIGURATION="$CONFIGURATION"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  functional:
    # s09: off for pull requests while the sprint is built (about 15 minutes a push). It still runs on main and when the workflow is
    # started by hand (Actions, CI, Run workflow, on the branch). Put `github.event_name == 'pull_request' ||` back after the last s09 task.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Functional tests (Testcontainers starts CISO Assistant)
        run: make test-functional CONFIGURATION="$CONFIGURATION"
      - name: Show the CISO Assistant inventory
        if: ${{ always() }}
        run: |
          dir=test-results/ca-inventory
          if [ -f "$dir/answers.json" ]; then cat "$dir/answers.json"; fi
          if [ -f "$dir/openapi-paths.json" ]; then
            jq -c '{openapi, info, all_paths}' "$dir/openapi-paths.json"
            jq -c '.paths | to_entries[] | {(.key): .value}' "$dir/openapi-paths.json"
          fi
      - name: Show the seed's scope apply, then the plan and apply after it
        if: ${{ always() }}
        run: |
          seed=test-results/scope-plan/seed-apply.json
          if [ -f "$seed" ]; then
            jq -c '{written, failed, skipped, not_applied}' "$seed"
            jq -r '.changes | group_by(.kind, .action, .outcome)[] | "\(.[0].kind) \(.[0].action) \(.[0].outcome): \(length)"' "$seed"
            jq -c '.changes[] | select(.outcome != "written")' "$seed"
          fi
          for file in test-results/scope-plan/scope-plan.md test-results/scope-plan/scope-plan.json test-results/scope-plan/second-apply.json; do
            if [ -f "$file" ]; then cat "$file"; fi
          done
      - name: Show the audit periods run across a quarter boundary
        if: ${{ always() }}
        run: |
          for file in test-results/audit-periods/*.txt; do
            if [ -f "$file" ]; then echo "== $file"; head -c 6000 "$file"; echo; fi
          done
      - name: Show the export of the seeded instance and the plan after it
        if: ${{ always() }}
        run: |
          for file in test-results/scope-export/*; do
            if [ -f "$file" ]; then echo "== $file"; head -c 8000 "$file"; echo; fi
          done
      - name: Show the review workflow, followed as the scope guide describes it
        if: ${{ always() }}
        run: |
          for file in test-results/review-workflow/*.txt; do
            if [ -f "$file" ]; then echo "== $file"; head -c 6000 "$file"; echo; fi
          done
      - name: Show the supplier apply and plans
        if: ${{ always() }}
        run: |
          for file in test-results/suppliers/*.txt; do
            if [ -f "$file" ]; then echo "== $file"; head -c 6000 "$file"; echo; fi
          done
      - name: Upload functional results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-results
          path: test-results
          if-no-files-found: ignore

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Generate a collector from the template, build and test it
        run: make test-template

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Build the runner image and test it (starts, non-root, no shell, read-only)
        run: make test-image HOUND_IMAGE=evidence-hound-runner:ci
      - name: Scan the runner image (high and critical findings fail the build)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: evidence-hound-runner:ci
          severity-cutoff: high
          only-fixed: false
          output-format: table

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Static checks of the Compose stack (docker compose config)
        run: make test-compose
      - name: Smoke test (stack up, healthy, runner runs once with the fake collector, HTTPS through Caddy)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: make compose-smoke

  trial:
    # s08-09: the interactive local trial, unattended, against a fresh local CISO Assistant (stops before Sophos).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Start and seed a local CISO Assistant
        run: make ca-up
      - name: Run the trial unattended
        run: HOUND_TRIAL_YES=1 make trial
      - name: Run it again (finished steps are skipped, the scope plans nothing new)
        run: HOUND_TRIAL_YES=1 make trial
      - name: Compliance impact and saved plans against the example scope (s08-06, s08-07)
        run: scripts/check-scope-plans.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: ShellCheck
        run: make lint-shell
      - name: Script tests
        run: make test-scripts

  terraform:
    # s09-55: the tutorial's control tests, with mock providers. No cloud account or credentials.
    runs-on: ubuntu-latest
    env:
      TERRAFORM_VERSION: 1.13.4
      TERRAFORM_SHA256: 98aa516201e948306698efd9954ab4cc0d1227c2578ba56245898b5f679e590b
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform
        run: |
          curl -fsSLo "$RUNNER_TEMP/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Control tests
        run: make test-terraform

  org-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for organisation-specific terms
        # Secrets are not available to PRs from forks; those are checked again on merge to main.
        if: github.event.pull_request.head.repo.fork != true
        env:
          ORG_DENYLIST: ${{ secrets.ORG_DENYLIST }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'origin/main..HEAD' }}
        run: scripts/check-org-data.sh "$RANGE"
      - name: Self-test (a denylisted canary must fail the check)
        if: github.event.pull_request.head.repo.fork != true
        env:
          ORG_DENYLIST: ${{ secrets.ORG_DENYLIST }}
        run: scripts/org-data-self-test.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

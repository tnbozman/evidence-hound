# Clearances register review: paste this under 'collectors:' in hound.yaml, then set the owner and the drop folder.
# The runbook is README.md beside this file; point an evidence plan row at your copy of it.
- name: clearances-register
  type: manual
  schedule: "0 6 * * *"
  settings:
    drop_folder: /var/lib/evidence-hound/manual/clearances-register
    checks: personnel.clearances_register_reviewed, personnel.pre_employment_screened, personnel.leavers_offboarded
    due_days: 183
    owner: Example security officer

# Facility and visitor controls: paste this under 'collectors:' in hound.yaml, then set the owner and the drop folder.
# The runbook is README.md beside this file; point an evidence plan row at your copy of it.
- name: facility-security
  type: manual
  schedule: "0 6 * * *"
  settings:
    drop_folder: /var/lib/evidence-hound/manual/facility-security
    checks: physical.visitors_controlled, physical.access_reviewed, physical.facility_plan_current
    due_days: 183
    owner: Example facilities manager

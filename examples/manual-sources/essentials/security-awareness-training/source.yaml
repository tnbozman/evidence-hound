# Security awareness training: paste this under 'collectors:' in hound.yaml, then set the owner and the drop folder.
# The runbook is README.md beside this file; point an evidence plan row at your copy of it.
- name: security-awareness-training
  type: manual
  schedule: "0 6 * * *"
  settings:
    drop_folder: /var/lib/evidence-hound/manual/security-awareness-training
    checks: training.awareness_completed, training.awareness_content_current
    due_days: 366
    owner: Example security officer

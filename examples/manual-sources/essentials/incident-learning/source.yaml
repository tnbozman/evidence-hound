# Incident learning and detection: paste this under 'collectors:' in hound.yaml, then set the owner and the drop folder.
# The runbook is README.md beside this file; point an evidence plan row at your copy of it.
- name: incident-learning
  type: manual
  schedule: "0 6 * * *"
  settings:
    drop_folder: /var/lib/evidence-hound/manual/incident-learning
    checks: incident.post_incident_reviewed, incident.response_coverage_evaluated, logging.events_normalised
    due_days: 183
    owner: Example security officer

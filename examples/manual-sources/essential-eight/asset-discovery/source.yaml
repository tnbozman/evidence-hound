# Asset discovery and vulnerability scanner: paste this under 'collectors:' in hound.yaml, then set the owner and the drop folder.
# The runbook is README.md beside this file; point an evidence plan row at your copy of it.
- name: asset-discovery
  type: manual
  schedule: "0 6 * * *"
  settings:
    drop_folder: /var/lib/evidence-hound/manual/asset-discovery
    checks: vuln.asset_discovery.fortnightly, vuln.scanner.database_current
    due_days: 92
    owner: Example IT owner

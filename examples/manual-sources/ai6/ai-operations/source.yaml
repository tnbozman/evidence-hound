# AI operations records: paste this under 'collectors:' in hound.yaml, then set the owner and the drop folder.
# The runbook is README.md beside this file; point an evidence plan row at your copy of it.
- name: ai-operations
  type: manual
  schedule: "0 6 * * *"
  settings:
    drop_folder: /var/lib/evidence-hound/manual/ai-operations
    checks: ai.stakeholders_identified, ai.systemic_issues_reviewed, ai.incidents_reviewed, ai.performance_monitored, ai.data_and_cyber_covered
    due_days: 92
    owner: Example AI system owner

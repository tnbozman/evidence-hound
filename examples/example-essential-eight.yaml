# Example deployment config for the fictional Example Pty Ltd's Essential Eight (November 2023) ML2 audit, and its ASD Essentials
# priority phase 1 audit run beside it during the migration (s14-01).
# Everything here is made up. Keep your organisation's real config in a private repo.
# Schema: schemas/config.schema.json. Guides: docs/configuration.md, docs/collectors/m365.md
# The audit EX-E8-2026 selects maturity levels 1 and 2 in CISO Assistant; ML3-only rows are skipped when publishing.
# EX-ESSENTIALS-2026 selects priority phase 1. One run fills both from the same evidence (docs/migrations/essential-eight-to-asd-essentials.md).

ciso_assistant:
  url: http://localhost:8000/api/        # HOUND_CA_URL overrides this
  token: env:HOUND_CA_TOKEN

evidence:
  root: ../.dev/evidence
  retention_days: 90

collectors:
  - name: example-m365
    type: m365
    schedule: "0 3 * * *"
    settings:
      tenant_id: 00000000-0000-4000-8000-000000000001     # fictional
      client_id: 00000000-0000-4000-8000-000000000002     # fictional
      supported_windows_builds: "10.0.22631, 10.0.26100"
    secrets:
      client_certificate: file:/run/secrets/m365_client_certificate

  - name: example-incident-register
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: ../.dev/manual/example-incident-register
      checks: incident.reported_to_ciso, incident.reported_to_asd, incident.response_plan_followed
      due_days: 31
      owner: Alex Example

  - name: example-backup-restore-test
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: ../.dev/manual/example-backup-restore-test
      checks: backup.restore_tested
      due_days: 92
      owner: Sam Example

  - name: example-application-control-review
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: ../.dev/manual/example-application-control-review
      checks: appcontrol.rulesets_validated
      due_days: 366
      owner: Sam Example

targets:
  - mapping: ../mappings/essential-eight-2023.yaml
    compliance_assessment: EX-E8-2026
  - mapping: ../mappings/asd-essentials-enterprise-it.yaml
    compliance_assessment: EX-ESSENTIALS-2026

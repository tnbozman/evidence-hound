# Scans every change for secrets, validates every pull request, comments what applying it would change in CISO Assistant, and applies it on merge.
#
# Setup in your private repo:
# - A self-hosted runner that can reach CISO Assistant (label: ciso-assistant).
# - Repository secrets HOUND_CA_URL and HOUND_CA_TOKEN: a read-only token for plan, and, on the environment, the token apply writes with.
# - An environment named ciso-assistant with required reviewers, so every apply waits for an approval after the merge.
# - EVIDENCE_HOUND_REF is the Evidence Hound release you run: the same version as HOUND_RUNNER_IMAGE in deploy/deploy.env.
name: compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EVIDENCE_HOUND_REF: v1.0.1
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Every change is scanned for secrets, with the history, before anything else runs. Secret scanning with push
  # protection in the repository settings stops most before they are pushed; this catches the rest in review.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  validate:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tnbozman/evidence-hound
          ref: ${{ env.EVIDENCE_HOUND_REF }}
          path: .evidence-hound
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: .evidence-hound/global.json
      - name: Validate the config, scope and mappings
        run: |
          hound() { dotnet run --project .evidence-hound/src/EvidenceHound.Cli -c Release -- "$@"; }
          hound config validate hound.yaml
          hound scope validate scope/ --config hound.yaml
          for mapping in mappings/*.yaml; do hound mapping validate "$mapping"; done

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: [self-hosted, ciso-assistant]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tnbozman/evidence-hound
          ref: ${{ env.EVIDENCE_HOUND_REF }}
          path: .evidence-hound
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: .evidence-hound/global.json
      - name: Plan the scope against CISO Assistant
        env:
          HOUND_CA_URL: ${{ secrets.HOUND_CA_URL }}
          HOUND_CA_TOKEN: ${{ secrets.HOUND_CA_TOKEN }}
        run: dotnet run --project .evidence-hound/src/EvidenceHound.Cli -c Release -- scope plan scope/ --config hound.yaml > plan.md
      - name: Comment the plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file plan.md

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, ciso-assistant]
    environment: ciso-assistant
    concurrency: ciso-assistant-apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tnbozman/evidence-hound
          ref: ${{ env.EVIDENCE_HOUND_REF }}
          path: .evidence-hound
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: .evidence-hound/global.json
      # The plan is saved outside the checkout (it is never committed) and shown in the job summary. Apply then writes exactly
      # that plan, and refuses it (scope.plan_stale) if the scope or CISO Assistant changed in between.
      - name: Plan the scope against CISO Assistant
        env:
          HOUND_CA_URL: ${{ secrets.HOUND_CA_URL }}
          HOUND_CA_TOKEN: ${{ secrets.HOUND_CA_TOKEN }}
        run: dotnet run --project .evidence-hound/src/EvidenceHound.Cli -c Release -- scope plan scope/ --config hound.yaml --out "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the saved plan to CISO Assistant
        env:
          HOUND_CA_URL: ${{ secrets.HOUND_CA_URL }}
          HOUND_CA_TOKEN: ${{ secrets.HOUND_CA_TOKEN }}
        run: dotnet run --project .evidence-hound/src/EvidenceHound.Cli -c Release -- scope apply "$RUNNER_TEMP/plan.json"

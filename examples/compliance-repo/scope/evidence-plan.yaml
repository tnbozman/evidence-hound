# yaml-language-server: $schema=../../../schemas/scope.schema.json
# How each control's evidence arrives, from whom and how often (docs/manual-evidence.md). Manual rows become recurring
# CISO Assistant tasks: the owner is emailed the runbook before each due date and sends the evidence to the GRC team,
# who record it in CISO Assistant. Owners need no login.
grc_team: IT team
evidence:
  # A collector gathers this every night; nobody is reminded.
  - ref_id: EV-MFA
    control: AC-MFA
    method: automated
    collector: example-m365

  # The backup service's owners run a restore each quarter and send the result. They are an owner contact in access.yaml.
  - ref_id: EV-BACKUP-RESTORE
    control: AC-BACKUP
    method: manual
    collector: example-backup-restore-test
    owner: Backup owners
    every: 3 months
    runbook: manual-sources/backup-restore-test.md

  # Once a year the incident response plan is approved and tested with a tabletop exercise, and the record is sent.
  - ref_id: EV-IR-PLAN-TEST
    control: AC-INCIDENT-RESPONSE
    method: manual
    collector: example-incident-response-plan
    owner: IT team
    every: 12 months
    runbook: manual-sources/incident-response-test.md

  # Once a year the IT team lists every account allowed to sign in without MFA, and why.
  - ref_id: EV-MFA-EXCEPTIONS
    control: AC-MFA
    method: manual
    owner: IT team
    every: 12 months
    runbook: manual-sources/mfa-exceptions-review.md

  # Each week the GRC team clears its review queue in one sitting: 'hound review' walks every decision waiting on a person.
  - ref_id: EV-WEEKLY-REVIEW
    control: AC-AUTO-EVIDENCE
    method: manual
    owner: IT team
    every: 1 week
    runbook: manual-sources/weekly-compliance-review.md

  # AI governance (docs/ai-grc.md): the register is checked every night from the scope files; the records a person keeps are
  # attested once a year (governance) and each quarter (operations).
  - ref_id: EV-AI-REGISTER
    control: AC-AI-REGISTER
    method: automated
    collector: example-ai-register

  - ref_id: EV-AI-GOVERNANCE
    control: AC-AI-GOVERNANCE
    method: manual
    collector: example-ai-governance
    owner: IT team
    every: 12 months
    runbook: manual-sources/ai-governance.md

  - ref_id: EV-AI-OPERATIONS
    control: AC-AI-GOVERNANCE
    method: manual
    collector: example-ai-operations
    owner: IT team
    every: 3 months
    runbook: manual-sources/ai-operations.md

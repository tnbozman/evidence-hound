# yaml-language-server: $schema=../../schemas/config.schema.json
# Example Pty Ltd's deployment config. Everything here is made up; your own lives in your private compliance repo.
# Guide: docs/configuration.md. Check it with: hound config validate hound.yaml
# Relative paths are relative to this file. Secrets are references only, never values.

ciso_assistant:
  url: https://ciso.example.com/api/     # HOUND_CA_URL overrides this, for example in CI
  token: env:HOUND_CA_TOKEN              # a personal access token for hound's service account

evidence:
  root: /var/lib/evidence-hound/evidence # outside the repo: evidence is never committed
  retention_days: 90
  period_retention_years: 7

# `hound serve` (the runner container) reads every schedule below in this time zone, and delays each collector's
# runs by up to jitter_seconds (a stable amount per collector).
scheduler:
  time_zone: Australia/Sydney
  jitter_seconds: 300

# The scope folder: lets a target name an audit series that runs in periods (see docs/scope.md).
scope: scope

collectors:
  - name: example-m365
    type: m365
    schedule: "0 3 * * *"                # nightly at 03:00 Sydney time, publishing to EX-E8-2026
    settings:
      tenant_id: 00000000-0000-4000-8000-000000000001     # fictional
      client_id: 00000000-0000-4000-8000-000000000002     # fictional
      supported_windows_builds: "10.0.22631, 10.0.26100"
    secrets:
      client_certificate: file:/run/secrets/m365_client_certificate

  # Manual sources: people drop their exports here, outside the repo. See manual-sources/README.md.
  - name: example-incident-register
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: /var/lib/evidence-hound/manual/example-incident-register
      checks: incident.reported_to_ciso, incident.reported_to_asd, incident.response_plan_followed
      due_days: 31
      owner: Alex Example

  # The incident response plan, approved and tested once a year (a tabletop exercise is enough); docs/incidents.md.
  - name: example-incident-response-plan
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: /var/lib/evidence-hound/manual/example-incident-response-plan
      checks: incident.response_plan_approved, incident.response_plan_tested
      due_days: 366
      owner: Alex Example

  - name: example-backup-restore-test
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: /var/lib/evidence-hound/manual/example-backup-restore-test
      checks: backup.restore_tested
      due_days: 92
      owner: Sam Example

  # AI governance (docs/ai-grc.md). The register entries are the ai blocks in scope/setup.yaml, read from the repo itself.
  - name: example-ai-register
    type: ai-register
    schedule: "0 6 * * *"
    settings:
      scope: scope

  # AI governance and operations records a person attests (examples/manual-sources/ai6/ in the Evidence Hound repo).
  - name: example-ai-governance
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: /var/lib/evidence-hound/manual/example-ai-governance
      checks: ai.senior_owner_named, ai.training_current, ai.policy_approved, ai.redress_process_in_place, ai.risk_method_documented, ai.use_disclosed, ai.generated_content_labelled, ai.retirement_recorded
      due_days: 366
      owner: Sam Example

  - name: example-ai-operations
    type: manual
    schedule: "0 6 * * *"
    settings:
      drop_folder: /var/lib/evidence-hound/manual/example-ai-operations
      checks: ai.stakeholders_identified, ai.systemic_issues_reviewed, ai.incidents_reviewed, ai.performance_monitored, ai.data_and_cyber_covered
      due_days: 92
      owner: Alex Example

# The audits that results are published to: the Essential Eight ML2 audit, the ASD Essentials priority phase 1 audit run beside it
# during the migration (rows whose manual sources are not set up yet stay not assessed), the DISP membership readiness
# self-assessment, and the AI6 self-assessment.
targets:
  - mapping: mappings/essential-eight-2023.yaml
    compliance_assessment: EX-E8-2026
    health_control: AC-AUTO-EVIDENCE
  - mapping: mappings/asd-essentials-enterprise-it.yaml
    compliance_assessment: EX-ESSENTIALS-2026
  - mapping: mappings/disp.yaml
    compliance_assessment: EX-DISP-2026
  - mapping: mappings/ai6.yaml
    compliance_assessment: EX-AI6-2026

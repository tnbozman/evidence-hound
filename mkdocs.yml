      - Sophos Central: collectors/sophos.md
      - Vulnerability scans: collectors/vuln-scan.md
      - Terraform tests: collectors/terraform-tests.md
      - Terraform drift: collectors/terraform-drift.md
      - CISO Assistant: collectors/ciso-assistant.md

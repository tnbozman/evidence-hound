# s13-05: the documentation site, built from docs/ with MkDocs Material (make docs; strict: warnings fail) and published
# to GitHub Pages by the release workflow. Sprint plans and their evidence logs stay in the repository, not on the site.
site_name: Evidence Hound
site_description: Continuous compliance evidence for CISO Assistant, for small teams in the defence industry.
site_url: https://tnbozman.github.io/evidence-hound/
repo_url: https://github.com/tnbozman/evidence-hound
repo_name: tnbozman/evidence-hound
edit_uri: edit/main/docs/
copyright: Evidence Hound contributors. Apache-2.0.
docs_dir: docs
strict: true

exclude_docs: |
  sprints/
  evidence/
  *.pdf

hooks:
  - tools/docs/hooks/repo_links.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - getting-started.md
      - Local trial: tutorials/local-trial.md
      - First deployment: tutorials/first-deployment.md
      - Guided setup: guided-setup.md

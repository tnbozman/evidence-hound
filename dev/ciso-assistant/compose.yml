# Disposable CISO Assistant for local development and manual checks. Not for production
# (see deploy/ for the reference deployment). Start with `make ca-up`, stop with `make ca-down`.
# Images are pinned to one release; the functional test fixture uses the same tag.
name: hound-ciso-assistant

x-backend-env: &backend-env
  ALLOWED_HOSTS: backend,localhost,127.0.0.1
  CISO_ASSISTANT_URL: https://localhost:8443
  DJANGO_DEBUG: "False"
  # Generated once into .dev/ca-secret-key by `make ca-up`; never committed.
  DJANGO_SECRET_KEY: ${HOUND_CA_SECRET_KEY:?run make ca-up so the secret key is generated}
  DJANGO_SUPERUSER_EMAIL: admin@example.com
  DJANGO_SUPERUSER_PASSWORD: ${HOUND_CA_ADMIN_PASSWORD:-change-me-local-only}
  HOME: /tmp

services:
  backend:
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.3.4
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ca-db:/code/db
      - ./seed:/seed:ro
    ports:
      # The API on the loopback interface only, so `hound publish` can reach it without TLS.
      - 127.0.0.1:8000:8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 420s

  frontend:
    image: ghcr.io/intuitem/ciso-assistant-community/frontend:v4.3.4
    restart: unless-stopped
    environment:
      PUBLIC_BACKEND_API_URL: http://backend:8000/api
      PUBLIC_BACKEND_API_EXPOSED_URL: https://localhost:8443/api
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  # Optional: `docker compose --profile kafka up -d` (or `make ca-up-kafka`) adds Redpanda and the official
  # dispatcher, so `HOUND_TRANSPORT=kafka hound publish` goes through the dispatcher's observation topic.
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    profiles: [kafka]
    command:
      - redpanda start --mode dev-container --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - 127.0.0.1:19092:19092

  dispatcher:
    # Upstream publishes no dispatcher image, so it is built from the same release tag.
    build: https://github.com/intuitem/ciso-assistant-community.git#v4.3.4:dispatcher
    profiles: [kafka]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      API_URL: http://backend:8000/api
      USER_TOKEN: ${HOUND_CA_TOKEN:-}  # make ca-up-kafka loads it from .dev/ca.env
      BOOTSTRAP_SERVERS: redpanda:9092
      ERRORS_TOPIC: errors

volumes:
  ca-db:
